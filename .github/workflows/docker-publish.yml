# 构建 Docker 镜像并推送到 GitHub Container Registry (GHCR)
#
# 为什么用 GHCR 而不是 Docker Hub：GHCR 用仓库内置的 GITHUB_TOKEN 鉴权，
# 不用配置任何 secret，fork 下来即可用；镜像就挂在本仓库的 Packages 里。
#
# 触发方式：
#   - 打 v* tag        → 正式版，构建 linux/amd64 + linux/arm64
#   - 推 main          → 出 :latest 和 :main，只构建 amd64
#   - 推 claude/** 分支 → 出按分支名的 tag，同时也更新 :latest，只构建 amd64
#                        （arm64 靠 QEMU 模拟，很慢；:latest 也跟着走是因为
#                         目前部署就是从这个分支出的，不给 :latest 的话
#                         docker compose pull 会拉不到东西）
#   - 手动 workflow_dispatch

name: Docker Publish

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., latest, v1.0.0)'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  # github.repository 形如 owner/repo，GHCR 要求全小写
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 只有打 tag 时才构 arm64，需要 QEMU；分支构建省掉这一步更快
      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            # 默认分支以外，claude/** 也更新 :latest —— 部署用的就是这个分支
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/heads/claude/') }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ startsWith(github.ref, 'refs/tags/') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_REF=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 镜像已推送"
            echo ''
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ''
            echo "拉取：\`docker pull ${{ env.IMAGE_NAME }}:<上面的 tag>\`"
          } >> "$GITHUB_STEP_SUMMARY"
