# WeChat Download API —— 单文件部署，只要这一个 docker-compose.yml
#
#   docker compose up -d
#   打开 http://localhost:5000/admin.html，按卡片三步走：
#     ① 扫码登录微信读书（/login.html）
#     ② 从书架导入公众号（/rss.html「添加订阅 → 从微信读书书架导入」）
#     ③ RSS 订阅管理
#   前提：先在微信读书 App 里关注你想订阅的公众号。不需要公众号后台。
#
# 要改配置，直接改下面 environment 里的值就行，不需要额外的 .env。
# （如果同目录下确实放了 .env，compose 会自动用它覆盖下面的默认值，两种都支持。）
#
# 更新到最新版：docker compose pull && docker compose up -d
# 想确认到底更没更新：curl http://localhost:5000/api/health，看 build.short_sha
# （管理页最底下也会显示，形如 claude/kind-bell-ian46x @ 1a2b3c4）
#
# 登录凭证和文章库都存在 ./data 里，别删。
# 群晖 / QNAP 等 NAS 若遇权限问题：chmod -R 777 ./data

services:
  wechat-api:
    # 直接用 CI 构建好的镜像，粘贴这个文件就能跑，不用克隆仓库。
    #
    # 注意别换成 tmwgsicp/wechat-download-api —— 那是上游镜像，
    # 没有本仓库的改动（整条微信读书通道都在这边），拉了等于没更新。
    image: ghcr.io/always1ov/wechat-download-api:latest
    pull_policy: always          # compose up 时总去看有没有新镜像
    #
    # 想从源码本地构建，把上面两行换成：
    # build: .
    #
    container_name: wechat-download-api
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:5000"
    volumes:
      # SQLite 文章库和微信读书登录态都在这里，必须持久化
      - ./data:/app/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}

      # ── 必改 ─────────────────────────────────────────────
      # RSS 图片代理靠它拼绝对地址；配错图片显示不出来。
      # 换成实际访问地址，如 http://192.168.1.10:5000 或 https://你的域名
      SITE_URL: ${SITE_URL:-http://localhost:5000}

      # ── 微信读书（唯一数据源）──────────────────────────────
      # 不用在这里填 Cookie —— 打开 /login.html 扫码更省事，
      # 扫完存在 ./data 里，wr_skey 过期还能用 wr_rt 自动续期。
      WEREAD_COOKIE: ${WEREAD_COOKIE:-}
      WEREAD_AUTO_RENEW: ${WEREAD_AUTO_RENEW:-true}    # wr_skey 过期自动用 wr_rt 续期
      # 登录态守护：后台定期探活 + 主动续期，别等采集撞上失效才补救。
      # 续不回来（wr_rt 也死了）会发 webhook 报警，管理页挂红条提示重新扫码。
      WEREAD_KEEPALIVE: ${WEREAD_KEEPALIVE:-true}
      # 检查间隔（秒），默认 6 小时，实际等待带 ±15% 抖动（固定节奏容易被风控当成机器）。
      # 低于 1800 会被抬到 1800：wr_skey 本来就按需续期，查得勤不会更早发现 wr_rt 失效。
      # 最近 1 小时内有真实采集请求成功过的话，这一轮会直接跳过，不额外发请求。
      WEREAD_KEEPALIVE_INTERVAL: ${WEREAD_KEEPALIVE_INTERVAL:-21600}
      WEREAD_APP_API: ${WEREAD_APP_API:-true}          # App 域接口（多一个「搜公众号」能力）
      WEREAD_AUTO_ADD_SHELF: ${WEREAD_AUTO_ADD_SHELF:-true}
      WEREAD_CONTENT_INTERVAL: ${WEREAD_CONTENT_INTERVAL:-2}
      WEREAD_PAGE_INTERVAL: ${WEREAD_PAGE_INTERVAL:-1}
      WEREAD_MAX_PAGES: ${WEREAD_MAX_PAGES:-5}

      # ── 图片缓存（离线看图 + 少打微信）─────────────────────
      # 微信图只向微信要一次，之后 RSS 阅读器、导出、各设备都吃本地副本。
      # 不开的话每个订阅者每次刷新都会去打微信，很容易触发风控。
      IMAGE_CACHE: ${IMAGE_CACHE:-true}
      IMAGE_CACHE_MAX_MB: ${IMAGE_CACHE_MAX_MB:-512}   # 超了按最久未用淘汰
      IMAGE_PREFETCH: ${IMAGE_PREFETCH:-true}          # 采集正文时顺手把图抓进缓存
      # RSS 正文里的图默认指向本服务（可离线）。设 true 则还原成微信直链 ——
      # 快一点点，但读者访问不到微信时图全挂，且请求量成倍打到微信。
      RSS_DIRECT_IMAGES: ${RSS_DIRECT_IMAGES:-false}

      # ── RSS 轮询 ─────────────────────────────────────────
      RSS_POLL_INTERVAL: ${RSS_POLL_INTERVAL:-3600}    # 轮询间隔（秒）
      ARTICLES_PER_POLL: ${ARTICLES_PER_POLL:-10}
      RSS_FETCH_FULL_CONTENT: ${RSS_FETCH_FULL_CONTENT:-true}

      # ── 限频 ────────────────────────────────────────────
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-10}
      RATE_LIMIT_PER_IP: ${RATE_LIMIT_PER_IP:-5}
      RATE_LIMIT_ARTICLE_INTERVAL: ${RATE_LIMIT_ARTICLE_INTERVAL:-3}

      # ── Webhook 通知（留空禁用，支持企业微信群机器人）───────
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_NOTIFICATION_INTERVAL: ${WEBHOOK_NOTIFICATION_INTERVAL:-300}

      # ── MCP：让 Claude / Cline 等 AI 客户端直接读你的文章 ───
      # 设 ENABLE_MCP=1 并填一个 MCP_TOKEN 才启用
      ENABLE_MCP: ${ENABLE_MCP:-0}
      MCP_TOKEN: ${MCP_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
